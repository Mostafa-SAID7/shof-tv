<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Circular background with gradient -->
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5c518;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4a017;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer circle with glow -->
  <circle cx="100" cy="100" r="95" fill="url(#goldGradient)" filter="url(#glow)" opacity="0.9"/>
  
  <!-- Inner circle -->
  <circle cx="100" cy="100" r="90" fill="#0d0d0a"/>
  
  <!-- Film reel design -->
  <g transform="translate(100, 100)">
    <!-- Center circle -->
    <circle cx="0" cy="0" r="25" fill="url(#goldGradient)"/>
    
    <!-- Film strip segments -->
    <g stroke="url(#goldGradient)" stroke-width="3" fill="none">
      <!-- Top segment -->
      <path d="M -35 -35 L -35 -55 Q -35 -65 -25 -65 L 25 -65 Q 35 -65 35 -55 L 35 -35"/>
      <!-- Right segment -->
      <path d="M 35 -35 L 55 -35 Q 65 -35 65 -25 L 65 25 Q 65 35 55 35 L 35 35"/>
      <!-- Bottom segment -->
      <path d="M 35 35 L 35 55 Q 35 65 25 65 L -25 65 Q -35 65 -35 55 L -35 35"/>
      <!-- Left segment -->
      <path d="M -35 35 L -55 35 Q -65 35 -65 25 L -65 -25 Q -65 -35 -55 -35 L -35 -35"/>
    </g>
    
    <!-- Film frames (small squares) -->
    <g fill="url(#goldGradient)" opacity="0.8">
      <rect x="-50" y="-50" width="8" height="8" rx="1"/>
      <rect x="-50" y="-35" width="8" height="8" rx="1"/>
      <rect x="-50" y="-20" width="8" height="8" rx="1"/>
      <rect x="-50" y="5" width="8" height="8" rx="1"/>
      <rect x="-50" y="20" width="8" height="8" rx="1"/>
      <rect x="-50" y="35" width="8" height="8" rx="1"/>
      <rect x="-50" y="50" width="8" height="8" rx="1"/>
      
      <rect x="42" y="-50" width="8" height="8" rx="1"/>
      <rect x="42" y="-35" width="8" height="8" rx="1"/>
      <rect x="42" y="-20" width="8" height="8" rx="1"/>
      <rect x="42" y="5" width="8" height="8" rx="1"/>
      <rect x="42" y="20" width="8" height="8" rx="1"/>
      <rect x="42" y="35" width="8" height="8" rx="1"/>
      <rect x="42" y="50" width="8" height="8" rx="1"/>
    </g>
    
    <!-- Center play button -->
    <polygon points="0,-12 18,0 0,12" fill="url(#goldGradient)"/>
  </g>
</svg>
